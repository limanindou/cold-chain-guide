AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ColdChain Guard — serverless cold-chain excursion monitoring for medicines and samples.
  Readings -> API Gateway -> Lambda -> DynamoDB; one Step Functions execution per incident
  (grace period, human acknowledgement, escalation on silence, SHA-256 evidence in S3);
  React UI on S3 + CloudFront. Scales to zero. Deploy your own: sam deploy --guided

Parameters:
  TimeScale:
    Type: String
    Default: "1"
    AllowedPattern: "^[1-9][0-9]{0,3}$"
    Description: Divides every grace/ack/recheck timer (45 turns a 15 min grace into 20 s for demos). Use 1 in production.
  DemoMode:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enables POST /demo/reset and exposes pending ack codes to the on-screen responder phones.
  SenderEmail:
    Type: String
    Default: ""
    Description: SES-verified sender address for alert emails. Leave empty to use in-app alerts only.
  DeviceApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared key sensors send in the x-device-key header (production would use AWS IoT Core certificates).
  HeartbeatSchedule:
    Type: String
    Default: rate(1 minute)
    Description: How often to check for silent sensors (EventBridge Scheduler expression). Production can use e.g. rate(5 minutes).
  DevOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Extra CORS origin for local frontend development.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref ColdChainTable
        TIME_SCALE: !Ref TimeScale
        DEMO_MODE: !Ref DemoMode

Resources:
  # ---------------------------------------------------------------- data
  ColdChainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  # ---------------------------------------------------------------- CDN (private buckets via OAC)
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes (paths without a file extension)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var last = req.uri.split('/').pop();
          if (last.indexOf('.') === -1) { req.uri = '/index.html'; }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ColdChain Guard UI and evidence reports
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: evidence
            DomainName: !GetAtt EvidenceBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /evidence/*
            TargetOriginId: evidence
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: false # serve the exact bytes that were fingerprinted

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${EvidenceBucket.Arn}/evidence/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${Distribution.DomainName}
          - !Ref DevOrigin
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, x-device-key]
        MaxAge: 600

  # ---------------------------------------------------------------- functions
  IngestReadingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /readings — store reading, evaluate rule, open incident + start workflow
      Handler: ingest_reading.app.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref IncidentStateMachine
          DEVICE_KEY: !Ref DeviceApiKey
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt IncidentStateMachine.Name }
      Events:
        PostReading:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /readings, Method: POST }

  IngestEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /events — POWER_LOST / POWER_RESTORED from battery-backed sensors (early warning)
      Handler: ingest_event.app.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref IncidentStateMachine
          DEVICE_KEY: !Ref DeviceApiKey
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt IncidentStateMachine.Name }
      Events:
        PostEvent:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /events, Method: POST }

  CheckHeartbeatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Every minute — flag sensors that went silent (the only thing that runs while all is well)
      Handler: check_heartbeats.app.handler
      Timeout: 30
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref IncidentStateMachine
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt IncidentStateMachine.Name }
      Events:
        Heartbeat:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref HeartbeatSchedule
            Description: ColdChain Guard silent-sensor check

  CheckRecoveredFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow task — is the latest reading back in range?
      Handler: check_recovered.app.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ColdChainTable }

  NotifyResponderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow task — store task token under a one-time ack code, alert responder (SES + in-app)
      Handler: notify_responder.app.handler
      Timeout: 15
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          FRONTEND_URL: !Sub https://${Distribution.DomainName}
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*

  RespondFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /incidents/{id}/respond — claim ack code once, resume the workflow
      Handler: respond.app.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: "*" # task-token callbacks are not resource-scoped; the token is the capability
      Events:
        Respond:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/incidents/{id}/respond", Method: POST }

  BuildEvidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow task — write JSON + HTML evidence report to S3 with SHA-256 fingerprint
      Handler: build_evidence.app.handler
      Timeout: 30
      Environment:
        Variables:
          EVIDENCE_BUCKET: !Ref EvidenceBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${EvidenceBucket.Arn}/evidence/*

  ApiReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Read-only API for the dashboard, incident pages and responder view
      Handler: api_read.app.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref IncidentStateMachine
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ColdChainTable }
      Events:
        Config: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /config, Method: GET } }
        Dashboard: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /dashboard, Method: GET } }
        Devices: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /devices, Method: GET } }
        Readings: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/devices/{id}/readings", Method: GET } }
        Incidents: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /incidents, Method: GET } }
        Incident: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/incidents/{id}", Method: GET } }
        Profiles: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /profiles, Method: GET } }
        Responders: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /responders, Method: GET } }

  DemoResetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /demo/reset — demo only (DEMO_MODE=true)
      Handler: demo_reset.app.handler
      Timeout: 30
      Environment:
        Variables:
          DEVICE_KEY: !Ref DeviceApiKey
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - Statement:
            - Effect: Allow
              Action: states:StopExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-incident:*
      Events:
        Reset:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /demo/reset, Method: POST }

  # ---------------------------------------------------------------- workflow
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}-incident
      RetentionInDays: 14

  IncidentStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AWS::StackName}-incident
      Type: STANDARD
      DefinitionUri: statemachine/incident.asl.json
      DefinitionSubstitutions:
        TableName: !Ref ColdChainTable
        TimeScale: !Ref TimeScale
        CheckRecoveredFunctionArn: !GetAtt CheckRecoveredFunction.Arn
        NotifyResponderFunctionArn: !GetAtt NotifyResponderFunction.Arn
        BuildEvidenceFunctionArn: !GetAtt BuildEvidenceFunction.Arn
      Tracing:
        Enabled: true
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref CheckRecoveredFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref NotifyResponderFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref BuildEvidenceFunction }
        - DynamoDBCrudPolicy: { TableName: !Ref ColdChainTable }
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"
            - Effect: Allow
              Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
              Resource: "*"

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CloudFrontUrl:
    Description: The app
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  FrontendBucket:
    Value: !Ref FrontendBucket
  EvidenceBucket:
    Value: !Ref EvidenceBucket
  TableName:
    Value: !Ref ColdChainTable
  StateMachineArn:
    Value: !Ref IncidentStateMachine
